<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>done</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="done">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Set the theme before first paint so the page never flashes the wrong colors.
    (function () {
      var t = null;
      try { t = localStorage.getItem('todo.theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <div class="page">
    <header class="top" hidden>
      <h1 class="title"><span id="title"></span></h1>
      <nav class="controls">
        <button id="prev" class="icon" aria-label="이전">‹</button>
        <button id="next" class="icon" aria-label="다음">›</button>
        <span class="modes">
          <button data-mode="day">일</button>
          <button data-mode="week">주</button>
          <button data-mode="month">월</button>
        </span>
        <button id="theme" class="icon" aria-label="라이트/다크 모드"></button>
      </nav>
    </header>
    <main id="main"></main>
    <footer id="status"></footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
