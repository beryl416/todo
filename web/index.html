<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>done</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="done">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="top" hidden>
      <h1 class="title"><span id="title"></span></h1>
      <nav class="steps">
        <button id="prev" class="icon" aria-label="이전">‹</button>
        <button id="next" class="icon" aria-label="다음">›</button>
      </nav>
      <nav class="modes">
        <button data-mode="day" aria-label="일간">d</button>
        <button data-mode="week" aria-label="주간">w</button>
        <button data-mode="month" aria-label="월간">m</button>
      </nav>
    </header>
    <main id="main"></main>
    <footer id="status"></footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
